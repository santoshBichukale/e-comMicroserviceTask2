spring:
  application:
    name: OrderService

  datasource:
    url: jdbc:mysql://localhost:3306/taskmicro3?createDatabaseIfNotExist=true
    username: root
    password: Santosh123@

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
